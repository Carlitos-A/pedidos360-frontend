<header class="navbar">
  <a class="brand" routerLink="/">Pedidos360</a>

  <nav class="nav-links">
    <a routerLink="/">Inicio</a>
    @if (loginDisplay()) {
      <a routerLink="/pedidos">Pedidos</a>
      <a routerLink="/perfil">Mi perfil</a>
    }
  </nav>

  <div class="nav-actions">
    @if (loginDisplay()) {
      <button class="btn btn-outline" (click)="logout()">Cerrar sesión</button>
    } @else {
      <button class="btn btn-primary" (click)="login()">Iniciar sesión con Microsoft</button>
    }
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
