@if (notice.message()) {
  <aside class="access-notice" role="alert">
    <strong>{{ notice.message() }}</strong>
    <a routerLink="/dashboard" (click)="notice.message.set('')">Ir al dashboard</a>
    <button
      type="button"
      class="secondary"
      (click)="notice.message.set('')"
      aria-label="Cerrar aviso"
    >
      Cerrar
    </button>
  </aside>
}
<router-outlet />
