name: Publicar frontend en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo de main
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular para la URL de GitHub Pages
        run: npm run build -- --base-href /pedidos360-frontend/

      - name: Preparar rutas directas de la SPA
        run: cp dist/pedidos360-front/browser/index.html dist/pedidos360-front/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pedidos360-front/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
